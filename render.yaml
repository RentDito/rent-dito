services:
  - type: web
    name: rentdito-api
    runtime: node
    # Explicit: Render's blueprint default is `starter`, which is billed. The
    # staging foundation is meant to cost nothing, so the plan is pinned rather
    # than inherited. Free instances sleep after ~15 minutes idle, so the first
    # request after a quiet period pays a cold start before /healthz answers.
    plan: free
    rootDir: .
    # `--include=dev` is required, not optional. NODE_ENV is set to production
    # below, and npm omits devDependencies when it sees that — which strips
    # typescript and @types/node, so `tsc` cannot resolve `process` and the
    # build fails with TS2591. Runtime still uses only the production
    # dependencies; the dev ones are needed solely to compile.
    buildCommand: npm ci --include=dev && npm run build -w @rentdito/contracts && npm run build -w @rentdito/api
    startCommand: npm run start -w @rentdito/api
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.14.1
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WEB_ORIGINS
        sync: false
      - key: FEATURE_ACCOUNTS
        value: "false"
      - key: FEATURE_MARKETPLACE
        value: "false"
      - key: FEATURE_LISTING_AUTHORING
        value: "false"
      - key: FEATURE_LISTING_MODERATION
        value: "false"
      - key: FEATURE_SAVED_INQUIRIES
        value: "false"
      - key: FEATURE_TENANCY_INVITATIONS
        value: "false"
      - key: FEATURE_TENANT_BILLING
        value: "false"
      - key: FEATURE_PAYMENT_PROOFS
        value: "false"
      - key: FEATURE_LANDLORD_OPERATIONS
        value: "false"
